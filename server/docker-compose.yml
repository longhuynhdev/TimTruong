services:
  api:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: timtruong-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${NEON_CONNECTION_STRING}
      Cors__AllowedOrigins__0: ${FRONTEND_URL}
      Features__EnableAutoMigrations: "false"
      # OpenTelemetry → Aspire Dashboard (OTLP over gRPC)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: timtruong-api
    depends_on:
      aspire-dashboard:
        condition: service_started
    ports:
      - "127.0.0.1:5309:8080"   # Caddy will proxy this

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    restart: unless-stopped
    container_name: timtruong-aspire-dashboard
    environment:
      DASHBOARD__OTLP__AUTHMODE: Unsecured
      DASHBOARD__FRONTEND__AUTHMODE: BrowserToken
      # Serve dashboard over plain HTTP so Caddy handles TLS
      ASPNETCORE_URLS: http://+:18888
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "false"
    ports:
      - "127.0.0.1:18888:18888"   # Dashboard UI — Caddy proxies this
