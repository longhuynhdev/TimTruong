name: Server CI

on:
  push:
    branches: [main, dev]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

# Push mới lên cùng branch/PR sẽ hủy run cũ đang chạy
concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TimTruong.slnx

      - name: Build
        run: dotnet build TimTruong.slnx -c Release --no-restore

      - name: Test
        run: dotnet test TimTruong.slnx -c Release --no-build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # push: false — chỉ kiểm tra image build được; đẩy GHCR là chuyện của CD sau này
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
